<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f3d24">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pinus Packindo">
<title>Portal &amp; Tools &middot; Pinus Packindo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --bg-soft:#f3f9f5;
    --green-900:#0f3d24;
    --green-700:#1d6b3f;
    --green-600:#237a49;
    --green-500:#2f9e5c;
    --green-300:#8fd1a8;
    --green-150:#d7f0e0;
    --green-100:#e9f7ee;
    --text:#152016;
    --text-dim:#63756a;
    --border:#dfeee5;
    --shadow: 0 2px 10px rgba(15,61,36,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:0 0 60px;
  }

  /* ---------- Header ---------- */
  header{
    background:linear-gradient(160deg, var(--green-900) 0%, var(--green-700) 60%, var(--green-600) 100%);
    color:#fff;
    padding:28px 20px 34px;
    border-radius:0 0 22px 22px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    right:-30px; top:-30px;
    width:160px; height:160px;
    background:radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--green-300);
    margin-bottom:8px;
  }
  h1{
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:clamp(24px,7vw,30px);
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .subtitle{
    font-size:13.5px;
    color:rgba(255,255,255,0.78);
    max-width:420px;
    line-height:1.5;
  }

  .logo-badge{
    width:52px;height:52px;
    background:#ffffff;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:7px;
    margin-bottom:14px;
    box-shadow:0 4px 14px rgba(0,0,0,0.18);
  }
  .logo-badge img{width:100%;height:100%;object-fit:contain;}

  /* ---------- Search (sticky) ---------- */
  .search-wrap{
    padding:14px 20px 0;
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:5;
  }
  .search-box{
    display:flex;
    align-items:center;
    gap:9px;
    background:var(--bg-soft);
    border:1px solid var(--border);
    border-radius:12px;
    padding:11px 14px;
  }
  .search-box svg{flex-shrink:0;color:var(--green-600);opacity:0.8;}
  .search-box input{
    background:none;
    border:none;
    outline:none;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    width:100%;
  }
  .search-box input::placeholder{color:var(--text-dim);}

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex;
    gap:8px;
    padding:14px 20px 4px;
    overflow-x:auto;
  }
  .tab{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    color:var(--green-700);
    background:var(--green-100);
    border:1px solid var(--green-150);
    border-radius:20px;
    padding:8px 15px;
    white-space:nowrap;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .tab .count{opacity:0.65;font-weight:500;margin-left:3px;}
  .tab.active{
    background:var(--green-700);
    color:#fff;
    border-color:var(--green-700);
  }
  .tab.active .count{opacity:0.8;}

  /* ---------- List ---------- */
  .section-label{
    font-family:'Sora',sans-serif;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-dim);
    padding:18px 20px 8px;
  }
  .list{
    padding:0 20px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .card{
    display:flex;
    align-items:flex-start;
    gap:13px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 14px;
    text-decoration:none;
    color:inherit;
    box-shadow:var(--shadow);
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
    animation:rise .3s ease backwards;
  }
  .card:active{transform:scale(0.98);}
  @media (hover:hover){
    .card:hover{border-color:var(--green-300); background:var(--bg-soft);}
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  @media (prefers-reduced-motion:reduce){ .card{animation:none;} }

  .badge{
    flex-shrink:0;
    width:42px;height:42px;
    border-radius:11px;
    background:var(--green-100);
    color:var(--green-700);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:16px;
  }
  .card-body{flex:1;min-width:0;}
  .card-title{
    font-family:'Sora',sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--text);
    margin-bottom:2px;
  }
  .card-domain{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--green-600);
    margin-bottom:5px;
    word-break:break-all;
  }
  .card-desc{
    font-size:12.5px;
    line-height:1.5;
    color:var(--text-dim);
  }
  .chevron{
    flex-shrink:0;
    color:var(--green-500);
    margin-top:10px;
  }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--text-dim);
  }
  .empty h3{
    font-family:'Sora',sans-serif;
    color:var(--text);
    margin:0 0 6px;
  }
  .empty p{font-size:13px;margin:0;}

  footer{
    text-align:center;
    margin-top:30px;
    padding:0 20px;
    font-size:11.5px;
    color:var(--text-dim);
  }
  footer .dot{color:var(--green-500);}
  footer .copyright{
    margin-top:6px;
    color:var(--text-dim);
    opacity:0.75;
    font-size:11px;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="logo-badge"><img src="logo-badge.png" alt="Pinus Packindo"></div>
    <div class="eyebrow">Pinus Packindo</div>
    <h1>Portal &amp; Tools</h1>
    <div class="subtitle">Semua portal dan tools perusahaan, terkumpul dalam satu genggaman.</div>
  </header>

  <div class="search-wrap">
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Cari portal atau tools&hellip;">
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="board"></div>

  <footer>
    <span id="footCount"></span> <span class="dot">&middot;</span> Ketuk kartu untuk membuka portal
    <div class="copyright">&copy; 2026 Pinus Packindo</div>
  </footer>
</div>

<script>
(function(){
  const LINKS = [
    { title:"Portal Internal", domain:"internal.pinuspackindo.com", desc:"Portal yang digunakan untuk segala hal yang berkaitan dengan kepegawaian dan dokumen aturan perusahaan.", category:"Portal" },
    { title:"Portal Inventaris", domain:"inventaris.pinuspackindo.com", desc:"Portal yang digunakan untuk pemantauan dan pengajuan atas segala permasalahan yang berkaitan dengan inventaris perusahaan.", category:"Portal" },
    { title:"Portal Finance", domain:"finance.pinuspackindo.com", desc:"Portal yang digunakan untuk proses pengajuan penerimaan dan pemasukan kas perusahaan yang antara PIC yang berkaitan dengan Finance.", category:"Portal" },
    { title:"Tools OKR", domain:"pinuspackindo-okr.vercel.app", desc:"Portal yang digunakan untuk proses penilaian dan pemantauan atas capaian TAL, OKR, dan SBG perusahaan.", category:"Tools" },
    { title:"Tools Audit", domain:"pinus-audit.vercel.app", desc:"Portal yang digunakan untuk penyajian report audit dan proses tindak lanjut oleh auditee.", category:"Tools" },
    { title:"Tools Purchase", domain:"procurement.pinuspackindo.com", desc:"Portal yang digunakan untuk segala analisa dan penyajian report yang berkaitan dengan procurement.", category:"Tools" },
    { title:"Tools Store", domain:"pinus-store-analytics.vercel.app", desc:"Portal yang digunakan untuk segala analisa dan penyajian report yang berkaitan dengan store.", category:"Tools" },
    { title:"Tools Bad/Expired Stock", domain:"stock.pinuspackindo.com", desc:"Portal yang digunakan untuk pengelolaan bad stock dan expired stock antara tim store, warehouse, dan inventory.", category:"Tools" }
  ];

  let activeCategory = 'Semua';
  let searchTerm = '';

  const board = document.getElementById('board');
  const tabsEl = document.getElementById('tabs');
  const searchInput = document.getElementById('searchInput');
  const footCount = document.getElementById('footCount');

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function initials(title){
    return title.replace(/[^A-Za-z ]/g,'').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  }

  function renderTabs(){
    const cats = ['Semua','Portal','Tools'];
    tabsEl.innerHTML = cats.map(c=>{
      const count = c==='Semua' ? LINKS.length : LINKS.filter(l=>l.category===c).length;
      return `<div class="tab ${activeCategory===c?'active':''}" data-cat="${c}">${c} <span class="count">${count}</span></div>`;
    }).join('');
    tabsEl.querySelectorAll('.tab').forEach(el=>{
      el.addEventListener('click', ()=>{
        activeCategory = el.dataset.cat;
        render();
      });
    });
  }

  function filtered(){
    const term = searchTerm.trim().toLowerCase();
    return LINKS.filter(l=>{
      if(activeCategory !== 'Semua' && l.category !== activeCategory) return false;
      if(!term) return true;
      return l.title.toLowerCase().includes(term) || l.domain.toLowerCase().includes(term) || l.desc.toLowerCase().includes(term);
    });
  }

  function cardHtml(l, i){
    const url = 'https://' + l.domain;
    return `
      <a class="card" href="${url}" target="_blank" rel="noopener" style="animation-delay:${i*35}ms">
        <div class="badge">${initials(l.title)}</div>
        <div class="card-body">
          <div class="card-title">${escapeHtml(l.title)}</div>
          <div class="card-domain">${escapeHtml(l.domain)}</div>
          <div class="card-desc">${escapeHtml(l.desc)}</div>
        </div>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
      </a>
    `;
  }

  function render(){
    renderTabs();
    const items = filtered();
    footCount.textContent = LINKS.length + ' tautan tersedia';

    if(items.length === 0){
      board.innerHTML = `<div class="empty"><h3>Tidak ditemukan</h3><p>Coba kata kunci atau kategori lain.</p></div>`;
      return;
    }

    if(activeCategory !== 'Semua' || searchTerm.trim()){
      board.innerHTML = `<div class="list">${items.map(cardHtml).join('')}</div>`;
    } else {
      const portal = items.filter(l=>l.category==='Portal');
      const tools = items.filter(l=>l.category==='Tools');
      board.innerHTML = `
        <div class="section-label">Portal</div>
        <div class="list">${portal.map(cardHtml).join('')}</div>
        <div class="section-label">Tools</div>
        <div class="list">${tools.map(cardHtml).join('')}</div>
      `;
    }
  }

  searchInput.addEventListener('input', ()=>{
    searchTerm = searchInput.value;
    render();
  });

  render();
})();
</script>

</body>
</html>
